name: Build and Push GTS-Federator Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Secret Check
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then echo "USER IS EMPTY"; else echo "USER IS SET"; fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then echo "PASS IS EMPTY"; else echo "PASS IS SET"; fi

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Timestamp Tag
        id: vars
        run: echo "sha_short=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            domoel/gts-federator:latest
            domoel/gts-federator:${{ steps.vars.outputs.sha_short }}
          no-cache: true
